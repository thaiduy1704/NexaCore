<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFF6FF"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="accent" x1="240" y1="120" x2="980" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="600" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="600" rx="32" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="520" rx="28" fill="url(#accent)" stroke="#CBD5E1" stroke-opacity="0.55"/>

  <!-- Title -->
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial" fill="#0F172A">
    <text x="90" y="130" font-size="44" font-weight="800" letter-spacing="-0.02em">Barcode Scanning</text>
    <text x="90" y="170" font-size="18" font-weight="600" fill="#475569">Scan-first workflow for warehouse & retail operations</text>
  </g>

  <!-- Barcode card -->
  <g filter="url(#shadow)">
    <rect x="90" y="210" width="520" height="280" rx="22" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>

  <!-- Barcode stripes -->
  <g transform="translate(130 255)">
    <rect width="440" height="18" rx="9" fill="#0F172A" fill-opacity="0.06"/>
    <g transform="translate(0 40)">
      <rect x="0" y="0" width="6" height="170" fill="#0F172A"/>
      <rect x="14" y="0" width="2" height="170" fill="#0F172A"/>
      <rect x="24" y="0" width="10" height="170" fill="#0F172A"/>
      <rect x="40" y="0" width="3" height="170" fill="#0F172A"/>
      <rect x="50" y="0" width="12" height="170" fill="#0F172A"/>
      <rect x="70" y="0" width="4" height="170" fill="#0F172A"/>
      <rect x="82" y="0" width="8" height="170" fill="#0F172A"/>
      <rect x="96" y="0" width="2" height="170" fill="#0F172A"/>
      <rect x="106" y="0" width="14" height="170" fill="#0F172A"/>
      <rect x="126" y="0" width="3" height="170" fill="#0F172A"/>
      <rect x="138" y="0" width="7" height="170" fill="#0F172A"/>
      <rect x="152" y="0" width="2" height="170" fill="#0F172A"/>
      <rect x="162" y="0" width="13" height="170" fill="#0F172A"/>
      <rect x="182" y="0" width="5" height="170" fill="#0F172A"/>
      <rect x="196" y="0" width="9" height="170" fill="#0F172A"/>
      <rect x="214" y="0" width="2" height="170" fill="#0F172A"/>
      <rect x="224" y="0" width="15" height="170" fill="#0F172A"/>
      <rect x="246" y="0" width="3" height="170" fill="#0F172A"/>
      <rect x="258" y="0" width="11" height="170" fill="#0F172A"/>
      <rect x="276" y="0" width="2" height="170" fill="#0F172A"/>
      <rect x="286" y="0" width="12" height="170" fill="#0F172A"/>
      <rect x="306" y="0" width="4" height="170" fill="#0F172A"/>
      <rect x="320" y="0" width="8" height="170" fill="#0F172A"/>
      <rect x="336" y="0" width="2" height="170" fill="#0F172A"/>
      <rect x="346" y="0" width="14" height="170" fill="#0F172A"/>
      <rect x="368" y="0" width="3" height="170" fill="#0F172A"/>
      <rect x="380" y="0" width="10" height="170" fill="#0F172A"/>
      <rect x="398" y="0" width="2" height="170" fill="#0F172A"/>
      <rect x="408" y="0" width="18" height="170" fill="#0F172A"/>
    </g>
  </g>

  <!-- Scanner device -->
  <g transform="translate(690 200)">
    <path d="M180 54c0-22 18-40 40-40h140c22 0 40 18 40 40v310c0 22-18 40-40 40H220c-22 0-40-18-40-40V54Z" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="205" y="40" width="250" height="260" rx="18" fill="#0F172A" fill-opacity="0.04" stroke="#CBD5E1"/>
    <rect x="230" y="70" width="200" height="18" rx="9" fill="#2563EB" fill-opacity="0.20"/>
    <rect x="230" y="105" width="150" height="12" rx="6" fill="#0F172A" fill-opacity="0.10"/>
    <rect x="230" y="130" width="190" height="12" rx="6" fill="#0F172A" fill-opacity="0.10"/>
    <rect x="230" y="155" width="120" height="12" rx="6" fill="#0F172A" fill-opacity="0.10"/>

    <!-- scanning beam -->
    <rect x="205" y="212" width="250" height="6" rx="3" fill="#22C55E" fill-opacity="0.55"/>
    <rect x="205" y="212" width="250" height="6" rx="3" fill="#22C55E" fill-opacity="0.20"/>

    <!-- barcode mini -->
    <g transform="translate(250 235)">
      <rect width="160" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <g transform="translate(18 18)" fill="#0F172A">
        <rect width="3" height="54"/>
        <rect x="8" width="6" height="54"/>
        <rect x="18" width="2" height="54"/>
        <rect x="26" width="8" height="54"/>
        <rect x="38" width="3" height="54"/>
        <rect x="48" width="10" height="54"/>
        <rect x="62" width="2" height="54"/>
        <rect x="70" width="7" height="54"/>
        <rect x="82" width="3" height="54"/>
        <rect x="92" width="9" height="54"/>
        <rect x="106" width="2" height="54"/>
        <rect x="114" width="12" height="54"/>
      </g>
    </g>

    <circle cx="330" cy="342" r="10" fill="#0F172A" fill-opacity="0.14"/>
  </g>
</svg>
