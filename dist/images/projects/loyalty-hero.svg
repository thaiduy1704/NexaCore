<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="card" x1="160" y1="140" x2="860" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="600" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="600" rx="32" fill="url(#bg)"/>
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial">
    <text x="90" y="130" font-size="44" font-weight="800" letter-spacing="-0.02em" fill="#0F172A">Customer Loyalty</text>
    <text x="90" y="170" font-size="18" font-weight="600" fill="#475569">Points " Tiers " Vouchers " Omnichannel</text>
  </g>

  <!-- Loyalty card -->
  <g filter="url(#shadow)">
    <rect x="90" y="220" width="640" height="300" rx="26" fill="url(#card)" stroke="#E2E8F0"/>
    <rect x="120" y="250" width="580" height="240" rx="22" fill="#FFFFFF" fill-opacity="0.75" stroke="#E2E8F0"/>
  </g>

  <!-- Card content -->
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial">
    <text x="150" y="300" font-size="13" font-weight="800" letter-spacing="0.14em" fill="#64748B">MEMBER</text>
    <text x="150" y="338" font-size="34" font-weight="900" letter-spacing="-0.02em" fill="#0F172A">GOLD</text>
    <text x="150" y="370" font-size="16" font-weight="600" fill="#475569">i√m th∞ﬂng & ∞u „i c· nh‚n ho·</text>

    <text x="150" y="424" font-size="12" font-weight="800" letter-spacing="0.12em" fill="#94A3B8">POINTS</text>
    <text x="150" y="458" font-size="28" font-weight="900" letter-spacing="-0.02em" fill="#0F172A">12,480</text>

    <text x="340" y="424" font-size="12" font-weight="800" letter-spacing="0.12em" fill="#94A3B8">VOUCHERS</text>
    <text x="340" y="458" font-size="28" font-weight="900" letter-spacing="-0.02em" fill="#0F172A">6</text>
  </g>

  <!-- Decorative stamp -->
  <g transform="translate(600 270)">
    <circle cx="190" cy="80" r="70" fill="#F59E0B" fill-opacity="0.12"/>
    <circle cx="190" cy="80" r="52" fill="#F59E0B" fill-opacity="0.10" stroke="#F59E0B" stroke-opacity="0.25"/>
    <path d="M190 46l10 21 23 3-17 16 4 23-20-11-20 11 4-23-17-16 23-3 10-21Z" fill="#F59E0B" fill-opacity="0.65"/>
  </g>

  <!-- Mini dashboard -->
  <g transform="translate(780 220)" filter="url(#shadow)">
    <rect x="0" y="0" width="330" height="300" rx="22" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <g transform="translate(810 250)">
    <rect width="270" height="14" rx="7" fill="#0F172A" fill-opacity="0.08"/>
    <rect y="28" width="190" height="14" rx="7" fill="#0F172A" fill-opacity="0.08"/>
    <rect y="66" width="270" height="12" rx="6" fill="#0F172A" fill-opacity="0.06"/>
    <rect y="88" width="240" height="12" rx="6" fill="#0F172A" fill-opacity="0.06"/>
    <rect y="110" width="200" height="12" rx="6" fill="#0F172A" fill-opacity="0.06"/>
    <rect y="150" width="270" height="110" rx="18" fill="#F59E0B" fill-opacity="0.10" stroke="#FDE68A" stroke-opacity="0.8"/>
    <path d="M18 234c30-44 58-22 78-52 20-30 40-44 70-20 30 24 44 6 76-22" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
